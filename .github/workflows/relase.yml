name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup update stable
      - name: Install protoc (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Install protoc (macOS)
        if: matrix.os == 'macOS-latest'
        run: brew install protobuf
      - name: Install protoc (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install protoc -y
      - name: Install rust dependencies
        run: |
          cargo install cargo-watch
          cargo install commitlint-rs
      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Frontend dependencies
        run: |
          cd src/frontend
          npm install
      - name: Coverage Frontend
        run: |
          cd src/frontend 
          npm run coverage
      - name: Test cli
        if: matrix.os == 'macOS-latest'
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcovCli.info --manifest-path Cargo.toml
      - name: Test cli (Ubuntu/Windows)
        if: matrix.os != 'macOS-latest'
        run: cargo test --all-features --workspace --manifest-path Cargo.toml
      - name: Report code coverage
        if: matrix.os == 'macOS-latest'
        # continue-on-error: cargo llvm-cov doesn't emit branch coverage on
        # stable Rust, so this lcov file has zero branch coverpoints. The
        # runner's Homebrew lcov (2.x) now hard-errors on that combination
        # instead of warning. This step is reporting/PR-comment only; the
        # actual test run already passed in the step above.
        continue-on-error: true
        uses: zgosalvez/github-actions-report-lcov@v7.1.0
        with:
          coverage-files: lcovCli.info
          artifact-name: code-coverage-cli-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
          title-prefix: "CLI"
      - name: Test Backend
        if: matrix.os == 'macOS-latest'
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcovBackend.info --manifest-path src/backend/Cargo.toml
      - name: Test Backend (Ubuntu/Windows)
        if: matrix.os != 'macOS-latest'
        run: cargo test --all-features --workspace --manifest-path src/backend/Cargo.toml
      - name: Report code coverage
        if: matrix.os == 'macOS-latest'
        # See continue-on-error note on the CLI coverage step above.
        continue-on-error: true
        uses: zgosalvez/github-actions-report-lcov@v7.1.0
        with:
          coverage-files: lcovBackend.info
          artifact-name: code-coverage-backend-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
          title-prefix: "BACKEND"
      - name: Run Project Build
        run: cargo run -- --build --prod-astro-build=true
      - name: Package Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          zip -r artifacts_linux.zip .
          mkdir -p artifacts
          mv artifacts_linux.zip artifacts/
      - name: Package Artifacts (Mac)
        if: matrix.os == 'macOS-latest'
        run: |
          zip -r artifacts_macos.zip .
          mkdir -p artifacts
          mv artifacts_macos.zip artifacts/
      - name: Package Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir artifacts
          Compress-Archive -Path . -DestinationPath artifacts\artifacts_windows.zip
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}
          path: artifacts/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download Artifacts
        uses: actions/download-artifact@v4.1.7
        with:
          pattern: build-artifacts-*
          path: artifacts/
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          draft: false
          tag_name: v0.1.3.${{github.run_number}}
          files: |
            artifacts/artifacts_macos.zip
            artifacts/artifacts_windows.zip
            artifacts/artifacts_linux.zip

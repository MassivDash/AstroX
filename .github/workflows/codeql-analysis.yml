name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "31 7 * * 3"

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language:
          - TypeScript
          - Rust

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      # build-mode: none - CodeQL analyzes the source directly with no
      # compilation step. Required for Rust (autobuild is unsupported
      # there) and, as of the CodeQL CLI bundled with codeql-action@v3,
      # for JavaScript/TypeScript too (autobuild was dropped for it).
      - name: Initialize CodeQL
        id: initialize
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          source-root: src

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
